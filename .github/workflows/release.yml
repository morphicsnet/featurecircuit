name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release preflight
        run: scripts/release_preflight.sh

  wheels:
    needs: preflight
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: python -m pip install --upgrade pip maturin
      - name: Build wheel
        run: maturin build --release -m core/py_nsi/Cargo.toml -o dist --interpreter python
      - name: Verify wheel install
        run: scripts/release_verify_artifacts.sh "$(ls -1 dist/py_nsi-*.whl | head -n 1)"
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: py_nsi-wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  sdist:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maturin
        run: python -m pip install --upgrade pip maturin
      - name: Build sdist
        run: maturin sdist -m core/py_nsi/Cargo.toml -o dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: py_nsi-sdist
          path: dist/*.tar.gz

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: py_nsi-*
          path: release_artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release_artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release_artifacts/*.whl
            release_artifacts/*.tar.gz
            release_artifacts/SHA256SUMS.txt
